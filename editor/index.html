<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>City Labs</title>
<link rel="icon" type="image/svg+xml" href="./logo.svg">
<style>
  :root { --bg: #0b0f14; --panel: rgba(14,19,26,.94); --line: #263241; --fg: #d8dde3; --muted: #7f8c9b; --acc: #3fb6ff; --warn: #f0b34a; --bad: #ff5a5a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 12px system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  button { background: #1b2430; color: var(--fg); border: 1px solid var(--line); border-radius: 5px; padding: 4px 9px; font: inherit; cursor: pointer; }
  button:hover { border-color: #3a4a5e; background: #222d3b; }
  button:disabled { opacity: .45; cursor: default; }
  button.on { background: #12405c; border-color: var(--acc); }
  button.danger:hover { border-color: var(--bad); color: #ffb3b3; }
  button.link { background: none; border: none; color: var(--acc); padding: 0; text-decoration: underline; }
  button.mini { padding: 0 5px; font-size: 11px; line-height: 16px; margin-left: 4px; }
  button.ghost { border-color: transparent; background: none; color: var(--muted); visibility: hidden; }
  .field:hover button.ghost { visibility: visible; }
  input, select, textarea { background: #0f151c; color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 3px 5px; font: inherit; min-width: 0; }
  textarea { width: 100%; font: 11px ui-monospace, monospace; resize: vertical; }
  textarea.bad, input.bad { border-color: var(--bad); }
  input[type=color] { padding: 0; width: 28px; height: 22px; }
  input[type=checkbox] { width: auto; }
  #top { position: fixed; top: 0; left: 0; right: 0; height: 38px; display: flex; gap: 6px; align-items: center; padding: 0 10px; background: var(--panel); border-bottom: 1px solid var(--line); z-index: 3; }
  #top b { margin-right: 8px; display: flex; align-items: center; gap: 7px; }
  #top b img { border-radius: 5px; }
  #github { color: var(--muted); display: flex; padding: 4px; border-radius: 5px; }
  #github:hover { color: var(--fg); background: #1b2430; }
  #top .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; flex-shrink: 0; }
  #top > * { flex-shrink: 0; }
  #top button { white-space: nowrap; }
  #source { flex: 1 1 auto !important; min-width: 30px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #save { white-space: nowrap; }
  @media (max-width: 980px) { #save { display: none; } }
  #filewrap { position: relative; }
  .menu { position: absolute; top: calc(100% + 6px); left: 0; min-width: 250px; background: #121921; border: 1px solid var(--line); border-radius: 8px; padding: 4px; box-shadow: 0 12px 32px #000a; z-index: 30; display: grid; -webkit-app-region: no-drag; }
  .menu[hidden] { display: none; }
  .menu button { border: none; background: none; text-align: left; display: flex; justify-content: space-between; align-items: center; gap: 18px; padding: 6px 10px; border-radius: 5px; }
  .menu button:hover { background: #1b2430; }
  .menu button[hidden] { display: none; }
  .menu kbd { color: var(--muted); font: 11px ui-monospace, monospace; }
  .menu hr { border: none; border-top: 1px solid var(--line); margin: 4px 2px; }
  /* desktop app without a system title bar: the top bar drags the window and hosts its buttons */
  body.frameless #top { -webkit-app-region: drag; user-select: none; }
  body.frameless #top button, body.frameless #top select, body.frameless #top input, body.frameless #top a { -webkit-app-region: no-drag; }
  body.frameless.mac #top { padding-left: 84px; }
  body.frameless.winlike #top { padding-right: calc(100vw - env(titlebar-area-x, 0px) - env(titlebar-area-width, calc(100vw - 140px)) + 8px); }
  #appmenu { display: none; font-size: 15px; line-height: 1; padding: 3px 8px; }
  body.frameless.winlike #appmenu { display: inline-block; }
  #save { margin-left: auto; color: var(--muted); white-space: nowrap; }
  #save.dirty { color: var(--warn); }
  #update { background: #1f4d2b; border-color: #2f8a4a; white-space: nowrap; }
  #update:disabled { opacity: .8; }
  #tools { position: fixed; top: 48px; left: 10px; width: 204px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; z-index: 2; }
  #tools .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  #tools .grid button { text-align: left; padding: 5px 6px; }
  #tools .grid button kbd { float: right; color: var(--muted); font: 10px ui-monospace, monospace; }
  #toolopts { margin-top: 8px; display: grid; gap: 5px; }
  #toolopts label { display: grid; grid-template-columns: 62px 1fr; align-items: center; gap: 4px; color: var(--muted); }
  #side { position: fixed; top: 48px; right: 10px; bottom: 40px; width: 340px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; display: flex; flex-direction: column; z-index: 2; }
  #tabs { display: flex; border-bottom: 1px solid var(--line); }
  #tabs button { flex: 1; border: none; border-radius: 0; background: none; padding: 8px 0; color: var(--muted); font-size: 11.5px; }
  #tabs button.on { color: var(--fg); box-shadow: inset 0 -2px var(--acc); }
  .pane { flex: 1; overflow: auto; padding: 10px; display: none; }
  .pane.on { display: block; }
  .muted { color: var(--muted); }
  .warn { color: var(--warn); background: rgba(240,179,74,.08); border: 1px solid rgba(240,179,74,.3); border-radius: 5px; padding: 6px 8px; margin: 6px 0; }
  .hdr { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
  .actions { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0 10px; }
  .fields { display: grid; gap: 4px; }
  .field { display: grid; grid-template-columns: 118px 1fr; gap: 6px; align-items: start; }
  .field > label { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-top: 4px; }
  .field.nested { grid-template-columns: 1fr; }
  .field.add { grid-template-columns: 118px 1fr; margin-top: 4px; opacity: .8; }
  .row { display: flex; gap: 4px; align-items: center; }
  .row.grow > input:first-child { flex: 1; }
  .row.vec input { width: 100%; }
  input.short { width: 100%; }
  .field input[type=text], .field input[type=number] { width: 100%; }
  .sublist { display: grid; gap: 6px; }
  .subrec { border: 1px solid var(--line); border-radius: 6px; padding: 6px; }
  .subhead { color: var(--muted); margin-bottom: 4px; display: flex; align-items: center; }
  .subhead button:first-of-type { margin-left: auto; }
  .list { display: grid; gap: 2px; margin-top: 6px; }
  #pane-defs .list { max-height: 34vh; overflow: auto; border: 1px solid var(--line); border-radius: 6px; padding: 3px; }
  .list div { padding: 3px 6px; border-radius: 4px; cursor: pointer; display: flex; gap: 6px; align-items: center; }
  .list div:hover { background: #1b2430; }
  .list div.on { background: #12405c; }
  .sw { width: 12px; height: 12px; border-radius: 3px; flex: none; border: 1px solid #0006; }
  .layers label { display: flex; gap: 6px; align-items: center; padding: 2px 0; }
  #hint { position: fixed; left: 10px; right: 360px; bottom: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; color: var(--muted); z-index: 2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #hint b { color: var(--fg); font-weight: 500; }
  #coords { position: fixed; right: 360px; bottom: 40px; font: 11px ui-monospace, monospace; color: var(--muted); z-index: 2; }
  #busy { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(5,8,12,.6); z-index: 10; font-size: 14px; }
  #busy[hidden] { display: none; }
  .modal-back { position: fixed; inset: 0; background: rgba(5,8,12,.55); z-index: 20; display: flex; align-items: center; justify-content: center; }
  .modal { background: #121921; border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; width: 380px; box-shadow: 0 16px 40px #000a; }
  .modal .fields { margin: 10px 0 4px; }
  .modal .field { grid-template-columns: 150px 1fr; align-items: center; }
  button.primary { background: #12405c; border-color: var(--acc); }
  #pane-script textarea.code { min-height: 260px; font: 12px/1.45 ui-monospace, monospace; tab-size: 2; white-space: pre; }
  #pane-gen .field { grid-template-columns: 130px 1fr; }
  #pane-gen .help { color: var(--muted); margin: 6px 0 10px; line-height: 1.4; }
  #pane-gen pre, #pane-script pre { background: #0f151c; border: 1px solid var(--line); border-radius: 5px; padding: 8px; font: 11px/1.4 ui-monospace, monospace; white-space: pre-wrap; word-break: break-word; max-height: 40vh; overflow: auto; margin: 8px 0 0; }
  #pane-script pre.err { border-color: var(--bad); color: #ffb3b3; }
  #pane-script details { margin-top: 10px; color: var(--muted); }
  #pane-script details pre { color: var(--fg); }
  body.shot #top, body.shot #tools, body.shot #side, body.shot #hint, body.shot #coords { display: none; }
</style>
</head>
<body>
<div id="top">
  <button id="appmenu" title="Меню" data-i18n-title="top.menu">☰</button>
  <b id="brand"><img src="./logo.svg" alt="" width="20" height="20">City Labs</b>
  <div id="filewrap">
    <button id="filemenu"><span data-i18n="menu.file">Файл</span> ▾</button>
    <div id="filelist" class="menu" hidden>
      <button id="new"><span data-i18n="top.new">Новая карта…</span><kbd data-k="N"></kbd></button>
      <button id="open"><span data-i18n="common.open">Открыть…</span><kbd data-k="O"></kbd></button>
      <button id="sample"><span data-i18n="top.sample">Пример — Vespera Bay</span></button>
      <hr>
      <button id="download"><span data-i18n="top.download">Скачать .vspb</span><kbd data-k="S"></kbd></button>
      <button id="writeProject" hidden><span data-i18n="top.writeProject">Записать в проект</span><kbd data-k="⇧S"></kbd></button>
      <button id="reset" hidden><span data-i18n="top.reload">Перечитать с диска</span></button>
      <hr>
      <button id="export"><span data-i18n="top.export">Экспорт…</span><kbd data-k="E"></kbd></button>
    </div>
  </div>
  <button id="quicksave" title="Скачать текущий мир как .vspb" data-i18n-title="top.downloadTip"><span data-i18n="top.download">Скачать .vspb</span></button>
  <span class="sep"></span>
  <button id="undo" title="Отменить (Ctrl+Z)" data-i18n-title="hist.undoTip">↶</button>
  <button id="redo" title="Повторить (Ctrl+Shift+Z)" data-i18n-title="hist.redoTip">↷</button>
  <span class="sep"></span>
  <span id="source" class="muted"></span>
  <span id="save">—</span>
  <button id="update" class="update" hidden></button>
  <select id="lang" title="Язык / Language" style="padding:2px 4px"></select>
  <a id="github" href="https://github.com/vicimpa/city-labs" target="_blank" rel="noopener" title="GitHub" data-i18n-title="top.github"><svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></a>
  <input id="file" type="file" accept=".vspb" hidden>
</div>
<div id="tools">
  <div class="grid">
    <button data-tool="select"><span data-i18n="tool.select">Выбор</span> <kbd>1</kbd></button>
    <button data-tool="road"><span data-i18n="kind.edge">Дорога</span> <kbd>2</kbd></button>
    <button data-tool="building"><span data-i18n="kind.building">Здание</span> <kbd>3</kbd></button>
    <button data-tool="surface"><span data-i18n="kind.surface">Площадка</span> <kbd>4</kbd></button>
    <button data-tool="furniture"><span data-i18n="kind.furniture">Объект</span> <kbd>5</kbd></button>
    <button data-tool="tree"><span data-i18n="kind.tree">Дерево</span> <kbd>6</kbd></button>
    <button data-tool="wind"><span data-i18n="kind.wind">Ветряк</span> <kbd>7</kbd></button>
    <button data-tool="rail"><span data-i18n="kind.rail">Ж/д путь</span> <kbd>8</kbd></button>
    <button data-tool="terrain"><span data-i18n="common.terrain">Рельеф</span> <kbd>9</kbd></button>
    <button data-tool="power"><span data-i18n="kind.powerline">ЛЭП</span> <kbd>0</kbd></button>
  </div>
  <div id="toolopts"></div>
</div>
<div id="side">
  <div id="tabs">
    <button data-tab="props" class="on" data-i18n="tab.props">Свойства</button>
    <button data-tab="defs" data-i18n="tab.defs">Типы</button>
    <button data-tab="find" data-i18n="tab.find">Поиск</button>
    <button data-tab="layers" data-i18n="tab.layers">Слои</button>
    <button data-tab="gen" data-i18n="tab.gen">Генераторы</button>
    <button data-tab="script" data-i18n="tab.script">Скрипт</button>
  </div>
  <div id="pane-props" class="pane on"></div>
  <div id="pane-defs" class="pane"></div>
  <div id="pane-find" class="pane"></div>
  <div id="pane-layers" class="pane"></div>
  <div id="pane-gen" class="pane"></div>
  <div id="pane-script" class="pane"></div>
</div>
<div id="coords"></div>
<div id="hint"></div>
<div id="busy" data-i18n="common.loading">загрузка…</div>
<script type="module" src="./main.js"></script>
</body>
</html>
